name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/deploy/staticwears

            echo "Pulling latest code..."
            git config --global --add safe.directory /home/deploy/staticwears
            git pull origin main

            echo "Building containers..."
            docker compose --env-file .env.supabase build --no-cache storefront admin email-worker

            echo "Restarting containers..."
            docker compose --env-file .env.supabase up -d

            echo "Restarting nginx..."
            docker compose --env-file .env.supabase restart nginx

            echo "Cleaning up old images..."
            docker image prune -f

            echo "Deploy complete!"
            docker compose --env-file .env.supabase ps
