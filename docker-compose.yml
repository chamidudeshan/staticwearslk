services:

  # ── Message Broker (Kafka — KRaft, no Zookeeper needed) ────────────────────
  kafka:
    image: bitnami/kafka:3.6
    container_name: staticwears-kafka
    restart: unless-stopped
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
    volumes:
      - kafka-data:/bitnami/kafka
    networks:
      - staticwears-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ── Email Worker (Kafka Consumer → Resend) ──────────────────────────────────
  email-worker:
    build:
      context: .
      dockerfile: Dockerfile.email-worker
    container_name: staticwears-email-worker
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    env_file: ./apps/storefront/.env.production
    environment:
      - KAFKA_BROKERS=kafka:9092
    networks:
      - staticwears-net

  # ── Storefront (Customer Site) ─────────────────────────────────────────────
  storefront:
    build:
      context: .
      dockerfile: Dockerfile.storefront
    container_name: staticwears-storefront
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    env_file: ./apps/storefront/.env.production
    environment:
      - KAFKA_BROKERS=kafka:9092
    expose:
      - "3000"
    networks:
      - staticwears-net

  # ── Admin Dashboard ─────────────────────────────────────────────────────────
  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: staticwears-admin
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    env_file: ./apps/admin/.env.production
    environment:
      - KAFKA_BROKERS=kafka:9092
    expose:
      - "3001"
    networks:
      - staticwears-net

  # ── Nginx Reverse Proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: staticwears-nginx
    restart: unless-stopped
    depends_on:
      - storefront
      - admin
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    networks:
      - staticwears-net

  # ── Phase 2: Self-hosted Supabase (uncomment when migrating off hosted) ─────
