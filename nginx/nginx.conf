events { worker_connections 1024; }

http {
  # Map WebSocket upgrades while keeping HTTP/1.1 keepalive for regular requests
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      keep-alive;
  }

  # Gzip compression — dramatically reduces HTML/JS/JSON transfer size
  gzip            on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied    any;
  gzip_vary       on;
  gzip_types
    text/plain text/css text/javascript
    application/javascript application/json
    text/xml application/xml image/svg+xml;

  keepalive_timeout 65;

  # Larger proxy buffers for Next.js responses (avoids temp files)
  proxy_buffer_size       128k;
  proxy_buffers           4 256k;
  proxy_busy_buffers_size 256k;

  # Persistent upstream connections (eliminates TCP handshake overhead per request)
  upstream storefront_upstream {
    server storefront:3000;
    keepalive 16;
  }
  upstream admin_upstream {
    server admin:3001;
    keepalive 16;
  }
  upstream kong_upstream {
    server kong:8000;
    keepalive 32;
  }

  # Redirect HTTP → HTTPS
  server {
    listen 80;
    server_name staticwears.com www.staticwears.com admin.staticwears.com api.staticwears.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  # Storefront
  server {
    listen 443 ssl;
    server_name staticwears.com www.staticwears.com;
    ssl_certificate     /etc/letsencrypt/live/staticwears.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staticwears.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    client_max_body_size 20M;

    # Next.js content-hashed static assets — safe to cache forever
    location /_next/static/ {
      proxy_pass            http://storefront_upstream;
      proxy_http_version    1.1;
      proxy_set_header      Connection "";
      proxy_set_header      Host $host;
      proxy_set_header      X-Real-IP $remote_addr;
      proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header      X-Forwarded-Proto $scheme;
      add_header            Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
      proxy_pass            http://storefront_upstream;
      proxy_http_version    1.1;
      proxy_set_header      Upgrade $http_upgrade;
      proxy_set_header      Connection $connection_upgrade;
      proxy_set_header      Host $host;
      proxy_set_header      X-Real-IP $remote_addr;
      proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header      X-Forwarded-Proto $scheme;
      proxy_connect_timeout 10s;
      proxy_read_timeout    60s;
      proxy_send_timeout    60s;
    }
  }

  # Admin Dashboard
  server {
    listen 443 ssl;
    server_name admin.staticwears.com;
    ssl_certificate     /etc/letsencrypt/live/staticwears.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staticwears.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    client_max_body_size 20M;

    location /_next/static/ {
      proxy_pass            http://admin_upstream;
      proxy_http_version    1.1;
      proxy_set_header      Connection "";
      proxy_set_header      Host $host;
      proxy_set_header      X-Real-IP $remote_addr;
      proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header      X-Forwarded-Proto $scheme;
      add_header            Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
      proxy_pass            http://admin_upstream;
      proxy_http_version    1.1;
      proxy_set_header      Upgrade $http_upgrade;
      proxy_set_header      Connection $connection_upgrade;
      proxy_set_header      Host $host;
      proxy_set_header      X-Real-IP $remote_addr;
      proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header      X-Forwarded-Proto $scheme;
      proxy_connect_timeout 10s;
      proxy_read_timeout    60s;
      proxy_send_timeout    60s;
    }
  }

  # Supabase API Gateway (Kong)
  server {
    listen 443 ssl;
    server_name api.staticwears.com;
    ssl_certificate     /etc/letsencrypt/live/api.staticwears.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.staticwears.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    client_max_body_size 50M;

    location / {
      proxy_pass            http://kong_upstream;
      proxy_http_version    1.1;
      proxy_set_header      Upgrade $http_upgrade;
      proxy_set_header      Connection $connection_upgrade;
      proxy_set_header      Host $host;
      proxy_set_header      X-Real-IP $remote_addr;
      proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header      X-Forwarded-Proto $scheme;
      proxy_connect_timeout 10s;
      proxy_read_timeout    60s;
      proxy_send_timeout    60s;
    }
  }
}
