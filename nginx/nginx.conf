worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 50M;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  # ── Storefront ──────────────────────────────────────────────────────────────
  server {
    listen 80;
    server_name staticwears.lk www.staticwears.lk;

    # Redirect HTTP → HTTPS
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name staticwears.lk www.staticwears.lk;

    ssl_certificate     /etc/nginx/ssl/staticwears.lk.crt;
    ssl_certificate_key /etc/nginx/ssl/staticwears.lk.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location /_next/static/ {
      proxy_pass http://storefront:3000;
      proxy_cache_valid 200 1y;
      add_header Cache-Control "public, immutable";
    }

    location / {
      proxy_pass http://storefront:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }
  }

  # ── Admin ───────────────────────────────────────────────────────────────────
  server {
    listen 80;
    server_name admin.staticwears.lk;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name admin.staticwears.lk;

    ssl_certificate     /etc/nginx/ssl/admin.staticwears.lk.crt;
    ssl_certificate_key /etc/nginx/ssl/admin.staticwears.lk.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
      proxy_pass http://admin:3001;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }
  }

  # ── Supabase API (Kong) ─────────────────────────────────────────────────────
  server {
    listen 80;
    server_name api.staticwears.lk;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name api.staticwears.lk;

    ssl_certificate     /etc/nginx/ssl/api.staticwears.lk.crt;
    ssl_certificate_key /etc/nginx/ssl/api.staticwears.lk.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
      proxy_pass http://kong:8000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
